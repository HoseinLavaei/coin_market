services:
  bot:
    build: .
    container_name: coin-market-bot
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      - db
    restart: always
    network_mode: host
    stop_grace_period: 60s
  db:
    image: timescale/timescaledb:latest-pg16
    container_name: coin-market-db
    environment:
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-password}
      - POSTGRES_DB=${DB_NAME:-coin_market_OLD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    stop_grace_period: 60s
volumes:
  postgres_data: